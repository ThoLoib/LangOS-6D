services:
  oscar:
    image: tholoi/oscar-plus
    build: .
    volumes:
      - .:/app
      - ../ULIP_thesis:/ulip
      - ../Uni3D:/uni3d
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - clip_cache:/root/.cache/clip
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      # torch ships libgomp.so.1; without it on the path open3d fails to import
      # (needed for step7/step8 + Stage-3 D_sym point sampling).
      - LD_LIBRARY_PATH=/usr/local/lib/python3.11/dist-packages/torch/lib
      # inject libEGL_nvidia + the glvnd loader so pyrender can render depth
      # headless on the GPU (Stage-3 VSD renderer, stage3_render.py).
      - NVIDIA_DRIVER_CAPABILITIES=all
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gedi:
    build:
      context: .
      dockerfile: Dockerfile.gedi
    ports:
      - "5060:5060"
    # The service was OOM-killed mid-run once (2026-07-27); every subsequent
    # RANSAC fit failed silently for 10h.  Come back up automatically.
    restart: unless-stopped
    healthcheck:
      # NOT curl: it is not installed in this image, so the old curl-based
      # check could never pass and the container sat permanently "unhealthy"
      # while serving requests fine.
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5060/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  foundationpose:
    image: shingarey/foundationpose_custom_cuda121:latest
    volumes:
      - ../FoundationPose:/workspace            # FP repo + server script + weights
      - .:/oscar:ro                             # read-only access to OSCAR data (CAD models etc.)
    ports:
      - "5050:5050"
    environment:
      - OPENCV_IO_ENABLE_OPENEXR=1
    entrypoint: >
      bash -c "
        source /opt/conda/etc/profile.d/conda.sh &&
        conda activate my &&
        cd /workspace &&
        python foundationpose_server.py --port 5050
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
  torch_cache:
  clip_cache:
  ollama_data:
