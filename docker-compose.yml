services:
  oscar:
    image: tholoi/oscar-plus
    build: .
    volumes:
      - .:/app
      - ../ULIP_thesis:/ulip
      - ../Uni3D:/uni3d
      - hf_cache:/root/.cache/huggingface
      - torch_cache:/root/.cache/torch
      - clip_cache:/root/.cache/clip
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  gedi:
    build:
      context: .
      dockerfile: Dockerfile.gedi
    ports:
      - "5060:5060"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5060/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  foundationpose:
    image: shingarey/foundationpose_custom_cuda121:latest
    volumes:
      - ../FoundationPose:/workspace            # FP repo + server script + weights
      - .:/oscar:ro                             # read-only access to OSCAR data (CAD models etc.)
    ports:
      - "5050:5050"
    environment:
      - OPENCV_IO_ENABLE_OPENEXR=1
    entrypoint: >
      bash -c "
        source /opt/conda/etc/profile.d/conda.sh &&
        conda activate my &&
        cd /workspace &&
        python foundationpose_server.py --port 5050
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5050/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
  torch_cache:
  clip_cache:
  ollama_data:
